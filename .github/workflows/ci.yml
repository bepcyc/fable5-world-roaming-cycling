name: ci

# NOTE: `on.push.branches` filtering makes Forgejo fail the run at "Set up
# job" — keep the plain list form; tag pushes also run release.yml (the
# runner's capacity: 2 absorbs both).
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    # ubuntu-24.04 (not ubuntu-latest): the forgejo host also runs a docker
    # runner advertising ubuntu-latest which steals and fails our jobs; the
    # versioned label is advertised only by the pop-os host runner and still
    # matches GitHub's fleet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # GPU gates (tools/probe-*, npm run gates:*) are intentionally NOT run here:
      # they need a real GPU with headed Chrome for WebGPU — see
      # tools/probe-real-crash.ts for the headed-only crash class. CI scope is
      # the env-independent gates: typecheck + production build + unit tests.
      # NOTE: no artifact upload. upload-artifact@v4 is github.com-only
      # (GHESNotSupportedError on Forgejo), v3 is hard-blocked on GitHub, and an
      # `if:` on a `uses:` step makes Forgejo fail the run at "Set up job".
      # Real artifacts (APK + AppImage) ship via release.yml's REST upload.
