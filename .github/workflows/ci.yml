name: ci

# branches-only: tag pushes run release.yml instead; firing ci on the same tag
# push makes the two jobs race a single-capacity runner (losers fail at setup).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # GPU gates (tools/probe-*, npm run gates:*) are intentionally NOT run here:
      # they need a real GPU with headed Chrome for WebGPU — see
      # tools/probe-real-crash.ts for the headed-only crash class. CI scope is
      # the env-independent gates: typecheck + production build + unit tests.
      # upload-artifact@v4 hard-fails on Forgejo (GHESNotSupportedError — the
      # artifact v2 API is github.com-only) and v3 is hard-blocked on GitHub,
      # so the dist artifact is GitHub-only; Forgejo skips this step. Release
      # assets ship via the release workflow's REST upload on both forges.
      - uses: actions/upload-artifact@v4
        if: github.server_url == 'https://github.com'
        with:
          name: dist
          path: dist
          retention-days: 7
